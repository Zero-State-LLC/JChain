name: Python client
on:
  push:
    branches: [main]
    paths: ["clients/python/**", ".github/workflows/client-python.yml"]
  pull_request:
    paths: ["clients/python/**", ".github/workflows/client-python.yml"]
permissions:
  contents: read
jobs:
  client-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]' mypy
      - run: python -m pytest -q
      - run: python -m mypy --strict src
