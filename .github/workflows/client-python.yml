name: Python client
on:
  push:
    branches: [main]
    paths: ["clients/python/**", ".github/workflows/client-python.yml"]
  pull_request:
    paths: ["clients/python/**", ".github/workflows/client-python.yml"]
permissions:
  contents: read
jobs:
  client-python:
    runs-on: ubuntu-latest
    # pyproject.toml declares Python 3.9 and later with classifiers for 3.9 to 3.13, so the tests
    # run on each. Type checking and the build need only one interpreter.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]' mypy build
      - run: python -m pytest -q
      - if: matrix.python == '3.12'
        run: python -m mypy --strict src
      - if: matrix.python == '3.12'
        run: python -m build
