name: Bug report
description: Something behaves differently from the spec.
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected (cite spec section or AT-xx)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This is not a security issue (security issues go through private reporting)
          required: true
