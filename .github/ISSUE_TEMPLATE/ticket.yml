name: Ticket (vertical slice)
description: A tracer-bullet slice a coding agent can pick up.
labels: ["ready-for-agent"]
body:
  - type: textarea
    id: build
    attributes:
      label: What to build
      description: End-to-end behavior from the user's perspective, in CONTEXT.md terms.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: blocked
    attributes:
      label: Blocked by
      value: "None (can start immediately)"
  - type: input
    id: refs
    attributes:
      label: Spec references
      description: e.g. FR-03, CT-02, AT-03
